<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Who's Watching?</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Netflix+Sans:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body>
    <div class="netflix-intro" id="netflixIntro">
        <div class="intro-logo">
            <span class="intro-letter">N</span>
            <span class="intro-letter">E</span>
            <span class="intro-letter">T</span>
            <span class="intro-letter">F</span>
            <span class="intro-letter">L</span>
            <span class="intro-letter">I</span>
            <span class="intro-letter">X</span>
        </div>
    </div>

    <header class="top-bar">
        <div class="logo">NETFLIX</div>
    </header>

    <main class="profile-container">
        <h1 class="title">Who's watching?</h1>

        <div class="profiles">
            <div class="profile" data-profile="provider">
                <div class="profile-avatar provider-avatar">
                    <span class="avatar-letter">P</span>
                </div>
                <div class="profile-name">Provider</div>
            </div>

            <div class="profile" data-profile="nourisher">
                <div class="profile-avatar nourisher-avatar">
                    <span class="avatar-letter">N</span>
                </div>
                <div class="profile-name">Nourisher</div>
            </div>
        </div>

        <button class="manage-btn">Manage Profiles</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
